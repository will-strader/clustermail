name: Incremental Email Update

on:
schedule:
# Every day at 02:15 UTC
- cron: ‘15 2 * * *’
workflow_dispatch:

jobs:
update:
runs-on: ubuntu-latest

steps:
  - name: Checkout repo
    uses: actions/checkout@v4

  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: '3.12'

  - name: Install dependencies
    run: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt

  - name: Run incremental update
    env:
      # Add any secrets required by fetch_new_messages() here, e.g.
      # MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
      # MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
    run: |
      python incremental_update.py

  - name: Commit & push artifacts if changed
    run: |
      git config --global user.name "github-actions[bot]"
      git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      git add data/email_embeddings.npy data/emails_with_clusters.csv || true
      if ! git diff --cached --quiet; then
        git commit -m "chore: automated incremental email update" || true
        git push origin ${{ github.ref }}
      else
        echo "No data changes to commit."
      fi